<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Voting App</title>
</head>
<body>

<h2>Voting System</h2>

<input id="phone" placeholder="05XXXXXXXX">
<br><br>

<select id="team">
<option value="1">Team 1</option>
<option value="2">Team 2</option>
<option value="3">Team 3</option>
<option value="4">Team 4</option>
<option value="5">Team 5</option>
<option value="6">Team 6</option>
<option value="7">Team 7</option>
</select>

<br><br>
<button onclick="vote()">Vote</button>

<script>
const GIST_ID = "1fae2f1477560df32188b623bbecbc5d";
const TOKEN = "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";

const API = `https://api.github.com/gists/${GIST_ID}`;

async function getData(){
  const res = await fetch(API);
  const data = await res.json();
  return JSON.parse(data.files["votes.json"].content);
}

async function vote(){
  const phone = document.getElementById("phone").value;
  const team = document.getElementById("team").value;

  if(!/^5\d{8}$/.test(phone)){
    alert("Invalid phone");
    return;
  }

  let data = await getData();

  if(data.voters.find(v=>v.phone===phone)){
    alert("Already voted");
    return;
  }

  data.votes[team]++;
  data.voters.push({
    phone: phone,
    teamId: team,
    time: new Date().toISOString()
  });

  await fetch(API,{
    method:"PATCH",
    headers:{
      "Authorization":`token ${TOKEN}`,
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      files:{
        "votes.json":{
          content: JSON.stringify(data,null,2)
        }
      }
    })
  });

  alert("Vote submitted");
}
</script>

</body>
</html>
